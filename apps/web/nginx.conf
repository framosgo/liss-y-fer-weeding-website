server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind Railway/HTTPS proxy: never redirect to :8080.
  absolute_redirect off;
  port_in_redirect off;

  # HTML shell must always revalidate — hashed /assets/* pick up new builds.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Surrogate-Control "no-store" always;
  }

  # Kill-switch script should never be sticky.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Vite hashed bundles only — safe to cache forever.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # Replaceable public files (dress images, pdf, svg) — short cache + revalidate.
  location ~* \.(png|jpg|jpeg|gif|svg|webp|woff2|pdf)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    try_files $uri =404;
  }

  # SPA fallback. Do not use $uri/ — a public folder with the same name as a
  # route (e.g. /dress-code) would trigger a directory redirect and break.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Surrogate-Control "no-store" always;
  }
}
