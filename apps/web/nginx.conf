server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind Railway/HTTPS proxy: never redirect to :8080.
  absolute_redirect off;
  port_in_redirect off;

  # Never cache the HTML shell — Vite hashes JS/CSS, so fresh HTML picks up new assets.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # SPA fallback. Do not use $uri/ — a public folder with the same name as a
  # route (e.g. /dress-code) would trigger a directory redirect and break.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Hashed build assets (and static files) can be cached aggressively.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2|pdf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
